interface:
  display_name: "SDLC (stacked PRs + workspaces)"
  short_description: "Multi-step work: subagents, gh stack, Scalar/sparse worktrees, bottom-up closeout"
  default_prompt: >
    Use $sdlc for multi-phase work: plan layers, spawn subagents with
    incremental check-ins, manage official gh stack PRs, and close every PR
    bottom-up with rubber-duck adversarial review, comment resolution, CI
    fixes, and squash-merge. For autotrain: incremental commits every cycle;
    stacked PRs only after positive-result runs; when training stops, full
    bottom-up closeout of open positive layers (see
    references/autotrain-iteration-delivery.md).
