# Project-local Codex configuration.
#
# Hooks (.codex/hooks.json) block raw `mv` of tracked paths and run the
# dashboard-parity and version-stamp checks after edits — the same set Claude
# Code and Copilot CLI get. Parity is certified by
# `python -m scripts.verify_agent_surfaces`.
[features]
hooks = true

# Serena MCP (semantic code navigation). Starts without indexing; call
# `activate_project` when semantic tools are needed. Older Codex builds only
# read MCP servers from ~/.codex/config.toml — parent owns that host setting.
[mcp_servers.serena]
startup_timeout_sec = 15
command = "serena"
args = [
  "start-mcp-server",
  "--context=codex",
  "--open-web-dashboard=false",
]
